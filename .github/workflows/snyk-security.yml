# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["master" ]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

        # For Snyk Open Source you must first set up the development environment for your application's dependencies
        # For example for Node
        #- uses: actions/setup-node@v4
        #  with:
        #    node-version: 20

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        #
        # The threshold is deliberate, not the default: Snyk reports any
        # finding of low severity or worse. What it does NOT do is decide this
        # check on its own, because it has no working way to record that a
        # finding has been read and answered. .snyk ignore entries are not
        # applied to Snyk Code by the CLI -- checked against SnykCode 1.1307.3,
        # which produced a SARIF with zero suppressions while nine paths were
        # listed under ignore: -- and dismissing an alert in the GitHub
        # Security tab changes only what GitHub displays, never the exit code
        # of the scan that found it.
        #
        # So the exit code here is treated as "the scan ran" or "the scan did
        # not run", and the gate below decides pass or fail against
        # .snyk-code-accepted, which is in the repository and reviewed in the
        # diff like any other file.
      - name: Snyk Code test
        run: |
          set +e
          snyk code test --severity-threshold=low --sarif-file-output=snyk-code.sarif
          rc=$?
          set -e
          # 0 is a clean scan and 1 is a scan that found something. Both mean
          # the scan ran, and the gate step reads the report either way.
          # Anything else -- 2 for an error, 3 for nothing to scan -- is a scan
          # that did not happen, and that must not be allowed to read green.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "snyk code test did not complete (exit $rc)"
            exit "$rc"
          fi
          echo "snyk code test completed (exit $rc); the gate step decides this check"

      - name: Save Snyk Code report
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: snyk-code-report
          path: snyk-code.sarif
          retention-days: 7

        # Every scan below runs even when the one above it failed. Without
        # this, one Snyk Code finding aborts the job and the dependency, IaC
        # and container scans never run at all.

        # Two steps from the sample workflow are deliberately not here.
        #
        # "snyk monitor --all-projects" is Snyk Open Source, which reads a
        # dependency manifest. This repository has none -- no composer.json,
        # no package.json, nothing Snyk Open Source supports -- so the step
        # answered "Could not detect supported target files" and exited 3 on
        # every run since it was added. The PHP dependencies of this codebase
        # are vendored, and the image's system packages are what Snyk
        # Container reports on below.
        #
        # "snyk iac test" reads Terraform, CloudFormation, Kubernetes and ARM.
        # A Dockerfile is not an IaC file to Snyk and neither is a compose
        # file, so that step answered "Could not find any valid IaC files" and
        # also exited 3 on every run.
        #
        # Both failures were structural: no change to this codebase could have
        # cleared them. Keeping them meant the Snyk Security check was red
        # whatever the code said, which is the same as having no check.

        # Build the docker image for testing
      - name: Build a Docker image
        id: build
        if: always()
        run: docker build -t your/image-to-test .

        # Runs Snyk Container (Container and SCA) analysis and uploads result to Snyk.
      - name: Snyk Container monitor
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: snyk container monitor your/image-to-test --file=Dockerfile

        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

        # Decide the check. Every finding Snyk reported has to appear in
        # .snyk-code-accepted with a written reason, or this fails. A finding
        # of a rule in a file where none was accepted fails, and so does a
        # second finding of a rule where one was accepted. A missing or
        # unreadable report fails too.
        #
        # This runs last so the report reaches the artifact and the Security
        # tab even on the runs where the gate fails.
      - name: Gate Snyk Code findings against the accepted list
        if: always()
        run: python3 .github/scripts/snyk_code_gate.py
