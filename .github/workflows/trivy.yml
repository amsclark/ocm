# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: trivy

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '20 15 * * 5'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build -t ocm:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: 'ocm:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Report only the vulnerabilities somebody can act on.
          #
          # Measured on the image this workflow builds: 228 findings at
          # CRITICAL or HIGH, and exactly one of them had a fixed version
          # available. 108 of the 228 were in linux-libc-dev, a set of kernel
          # headers pulled in as a build dependency for the PHP extensions; a
          # container runs the host's kernel, so those headers are never the
          # kernel anything executes. None of that is work anybody can do, and
          # it buried the one finding that was.
          #
          # A vulnerability with no fix does not stop being real. It stops
          # being a task. When Debian publishes a fix, the finding reappears
          # here with a fixed version, which is the signal to bump the base
          # image digest in the Dockerfile.
          ignore-unfixed: 'true'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
