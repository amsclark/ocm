# CodeQL, for the JavaScript in cms/js and cms/app, and for the workflow files
# in this directory.
#
# CodeQL has no PHP analyzer, so it cannot see the application itself. That is
# not a configuration mistake to be fixed here: there is nothing to enable. The
# PHP is covered by .semgrep/ocm-sinks.yml, a ruleset that models this
# application's own sinks -- DB::query() takes SQL it does not escape,
# pl_template_sub() takes HTML it does not encode -- because a scanner that
# only knows mysqli_query() and echo finds nothing in this codebase.
#
# This repository used to carry two copies of this file, codeql.yml and
# codeql-analysis.yml, identical apart from their cron minute. Both were
# javascript-only, both were switched off by GitHub for repository inactivity,
# and neither had ever produced a run. There is one now.
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Thursday, 03:32 UTC.
    - cron: '32 3 * * 4'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `actions` analyzes the workflow files themselves, which is worth
        # having on a repository whose workflows hold no secrets but do check
        # out pull request code.
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # The default suite is quiet. This is a security review, so take the
          # extended one.
          queries: security-extended

      # No Autobuild step: neither of these languages is compiled.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
