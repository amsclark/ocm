name: publish-image

# Builds the Dockerfile and pushes the result to GitHub Container Registry.
#
#   ghcr.io/amsclark/ocm:latest        every push to master
#   ghcr.io/amsclark/ocm:1.2.3, :1.2   a v1.2.3 tag
#   ghcr.io/amsclark/ocm:sha-<short>   every run
#   ghcr.io/amsclark/ocm:<branch>      a manual run on any branch
#
# This repository takes only security backports, so every merge to master is
# a fix the published image has to carry. The push trigger, not a schedule,
# is what keeps the image current. Run it with docker-compose.image.yml.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
