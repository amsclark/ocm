; OCM PHP settings.
;
; The upload limits are the ones that matter: OCM stores client documents, and
; the defaults (2M) reject most scanned PDFs.
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 256M
max_execution_time = 300

; OCM builds its own error pages. Showing PHP errors to the browser on a
; production deployment leaks file paths and SQL.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Session cookies are only sent over HTTPS when force_https is on; the
; application sets that. These two are unconditional.
session.cookie_httponly = 1
session.use_strict_mode = 1
