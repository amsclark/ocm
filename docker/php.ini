; OCM PHP settings.
;
; The upload limits are the ones that matter: OCM stores client documents, and
; the defaults (2M) reject most scanned PDFs.
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 256M
max_execution_time = 300

; OCM builds its own error pages. Showing PHP errors to the browser on a
; production deployment leaks file paths and SQL.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Session cookie hardening.
;
; session.cookie_secure is NOT set here. A plain-HTTP deployment -- `docker
; compose up` on a laptop, or a box behind a proxy that does not forward the
; scheme -- cannot log in at all if the cookie is marked Secure, because the
; browser then declines to send it back. Instead the application sets the flag
; per request, in pika-danio.php and pika_cms.php, whenever the request
; actually arrived over HTTPS.
;
; SameSite=Lax is the browser-side half of the CSRF defence: it stops the
; session cookie riding along on a cross-site POST. pl_csrf_check() is still
; the primary defence, because Lax does not cover every case and an old
; browser may ignore it entirely. Lax rather than Strict so that following a
; link into OCM from webmail still arrives logged in.
;
; use_only_cookies and use_trans_sid keep the session id out of URLs, where it
; would be copied into bookmarks, pasted into tickets and logged by every
; proxy in the path.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
session.use_trans_sid = 0
session.use_strict_mode = 1

; Drop the X-Powered-By header. It publishes the exact PHP build, which is
; the first thing a scanner looks for to pick an exploit.
expose_php = Off
