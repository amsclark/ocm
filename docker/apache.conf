<VirtualHost *:80>
	DocumentRoot /var/www/html

	# OCM reads its own configuration directory from this variable. It holds
	# the database credentials and any per-deployment template overrides.
	SetEnv custom_directory /var/www/html/cms-custom

	<Directory /var/www/html/cms>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The configuration directory holds database credentials in a .php file.
	# PHP would execute rather than print it, but a mis-set handler or a
	# backup file (settings.php~, settings.php.bak) would serve it as text.
	# Deny the whole directory over HTTP; only the application reads it.
	<Directory /var/www/html/cms-custom>
		Require all denied
	</Directory>

	# cms/app/ is server-side only: the library classes under app/lib/ and
	# app/extralib/, the maintenance scripts under app/scripts/, and the
	# schema under app/sql/. No template references anything in it as a web
	# asset, but every .php file in it was reachable over HTTP and would run
	# on request.
	#
	# app/scripts/ is the sharp end. Those files are CLI tools: they do their
	# work at top level with no authentication check, because the only assumed
	# caller is cron or an operator with a shell. app/lib/ is the quieter
	# version of the same problem -- those files expect to be included after
	# the bootstrap has run, so requesting one directly executes it without
	# the context it assumes. app/sql/ is the schema, including the seed
	# passwords.
	#
	# Denying the directory is the right granularity: there is no legitimate
	# HTTP caller. The scripts also carry their own PHP_SAPI guard so they
	# stay safe if this vhost is ever not the one in front of them.
	<Directory /var/www/html/cms/app>
		Require all denied
	</Directory>

	# Nothing outside cms/ is meant to be served.
	<Directory /var/www/html>
		Options -Indexes
		AllowOverride None
	</Directory>

	# Branded error pages.
	#
	# Without these, a mistyped URL or a stale bookmark lands staff on
	# Apache's stock "Not Found" page: no way back into the application, and
	# a server banner that says which Apache build this is (CWE-200 on the
	# disclosure side, a dead end on the usability side).
	#
	# The documents live in their own tree rather than under cms/ on purpose.
	# ErrorDocument is served by an internal redirect that keeps the original
	# request method and re-runs the <Directory> rules, so a document stored
	# inside a directory that has its own restrictions can trip those same
	# restrictions while rendering. Apache then detects the loop and serves
	# the stock page anyway -- precisely for the request that most needs a
	# real answer. /errors carries no restriction beyond "no listings", so it
	# always renders.
	#
	# Static .html, no PHP: a 500 page that needs the bootstrap, a session or
	# the database is useless exactly when it is needed. The documents
	# deliberately do not echo the requested URL back -- some Apache
	# configurations pass %{REQUEST_URI} through unescaped and a reflecting
	# error page becomes a reflected-XSS sink.
	<Directory /var/www/html/errors>
		Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch
		AllowOverride None
		Require all granted
	</Directory>

	ErrorDocument 403 /errors/403.html
	ErrorDocument 404 /errors/404.html
	ErrorDocument 500 /errors/500.html

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
