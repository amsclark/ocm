# Suggested Apache configuration for an OCM site.
#
# Copy to /etc/apache2/conf-available/ocm.conf and run `a2enconf ocm`, or on
# RHEL-family systems to /etc/httpd/conf.d/ocm.conf. Adjust the paths below if
# you installed somewhere other than /var/www/html.
#
# Requires Apache 2.4. The directives here use the 2.4 authorization syntax
# (`Require`), not the 2.2 syntax (`Order` / `Deny from`).

# Tells OCM where cms-custom lives. Required unless the custom directory sits
# at the path the application defaults to.
SetEnv custom_directory /var/www/html/cms-custom

# The application itself.
<Directory /var/www/html/cms>
	Require all granted
	AllowOverride None

	# No directory listings. Several directories under cms/ have no index file,
	# and a listing of them is a map of the installation for anyone looking.
	Options -Indexes -ExecCGI
	Options +FollowSymLinks
</Directory>

# Library code. It is included by the pages in cms/, never requested directly,
# so nothing needs to reach it over HTTP.
<Directory /var/www/html/cms/app>
	Require all denied
</Directory>

# Not reachable over the web, at all.
#
# This directory holds config/settings.php, and therefore the database
# password. Denying the whole directory rather than that one file is
# deliberate: editors leave copies behind, and settings.php~ or
# settings.php.bak do not end in .php, so Apache would hand them to anyone who
# guessed the name as plain text.
<Directory /var/www/html/cms-custom>
	Require all denied
</Directory>

# This directory. It describes your own server configuration.
<Directory /var/www/html/httpd-config>
	Require all denied
</Directory>

# Uploaded documents are served through the application, which checks whether
# the user is allowed to see the case first. Reaching them directly would skip
# that check.
<Directory /var/www/html/cms/uploads>
	Require all denied
</Directory>

# Response headers. mod_headers must be enabled: a2enmod headers.
#
# The application sends the full set the OWASP Secure Headers Project
# recommends from PHP, in pl_send_security_headers() in cms/app/lib/pl.php:
# these three plus Permissions-Policy, the three Cross-Origin-* headers,
# Cache-Control, Strict-Transport-Security and the Content-Security-Policy.
# You do not need to add any of those here.
#
# These three stay because they also cover what PHP never sees: a static file,
# and an error page Apache generated on its own.
#
# setifempty, not `always set`. `Header always set` does NOT replace what PHP
# sent: `always` selects a different table (err_headers_out) from the one PHP
# writes to, so both values go on the wire and the client gets the header
# twice. For Referrer-Policy that matters, because two header fields are read
# as one comma-joined list and the value the browser applies depends on which
# one it parses last. setifempty writes the header only when the response does
# not already carry it, so a PHP page keeps the application's value and a
# static file gets one from here.
#
# Requires Apache 2.4.7 or newer for the setifempty action.
#
# They should still agree with the PHP function, so that the two kinds of
# response are not protected differently.
<IfModule mod_headers.c>
	# Do not let the site be framed. Prevents clickjacking a logged-in session.
	# DENY, not SAMEORIGIN, so that it says what the CSP's
	# frame-ancestors 'none' says.
	Header setifempty X-Frame-Options "DENY"
	Header setifempty X-Content-Type-Options "nosniff"
	# strict-origin-when-cross-origin, not the stricter no-referrer: the
	# application's own CSRF check falls back to the Origin and Referer
	# headers, and no-referrer removes both. pl_send_security_headers() in
	# cms/app/lib/pl.php has the full reason.
	Header setifempty Referrer-Policy "strict-origin-when-cross-origin"

	# Strict-Transport-Security is sent by the application instead, and only
	# when the request arrived over HTTPS AND the force_https setting is on.
	# That setting is the operator saying they have committed to HTTPS, which
	# is the thing this header needs to be true: a browser that has seen it
	# will refuse to connect over plain HTTP for a year, and there is no way
	# to call that back early.
	#
	# Turn force_https on in the system settings rather than uncommenting a
	# line here, so that an install which is not ready cannot be locked out of
	# itself by a config file it copied.
</IfModule>

# Upload limits. These only work with mod_php. Under php-fpm, Apache does not
# read them — put the same values in a .ini file instead. See
# "Uploads fail over a few megabytes" in the wiki install page.
<IfModule mod_php.c>
	<Directory /var/www/html/cms>
		# post_max_size must exceed upload_max_filesize. If it does not, a
		# large upload is discarded before PHP checks its size, and PHP
		# reports that as an empty $_FILES array rather than as an error.
		php_value upload_max_filesize 32M
		php_value post_max_size 34M
		php_value memory_limit 256M
		php_value max_execution_time 300

		# Errors to the log, never to the page. A PHP error message here can
		# contain a file path, a SQL fragment, or client data.
		php_flag display_errors Off
		php_flag log_errors On

		php_value session.cookie_httponly 1
		php_value session.use_strict_mode 1

		# Confines PHP's file access to this tree, so a file-read bug cannot
		# reach /etc/passwd or a key in another user's home directory. Worth
		# having, but test it: it also blocks PHP's session and upload
		# temporary directories unless they are inside the tree or listed
		# here, and the symptom is a login that silently never completes.
		#
		# php_admin_value open_basedir /var/www/html/:/tmp/
	</Directory>
</IfModule>

# Logging the OCM username alongside each request. Useful when you need to
# reconstruct who did what. Add to the VirtualHost that serves the site; it
# cannot go here, because CustomLog is not valid in a Directory context.
#
#	CustomLog /var/log/apache2/ocm_request.log \
#		"%t %{cms_user}n %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
